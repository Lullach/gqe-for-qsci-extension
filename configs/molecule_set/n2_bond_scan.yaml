# Multi-molecule set: N2 at several bond lengths (Phase 3 — the bond-length
# scan). Every entry shares the same (10e, 8o) active space and 16 qubits, so
# the operator SET is nearly identical across geometries — only the feature
# VALUES change (amplitudes grow toward dissociation, gaps shrink, couplings
# shift). This isolates the conditioning/transfer question from the
# vocabulary-portability question, which only enters at Phase 4.
#
# Expanded by Factory.create_molecule_bundles() into one PySCFMolecule (+ pool,
# + QSCI pipeline, + feature tensors) per bond length. Geometry caching in
# molecule.py hashes the geometry, so each length is computed once and reused.
#
# Select with:  python train.py molecule_set=n2_bond_scan
#
# base is the template; bond_length is overridden per instance.
base:
  _target_: gqe_qsci.molecule.PySCFMolecule
  geometry:
    type: linear_chain
    atoms: ['N', 'N']
    bond_length: 1.6          # placeholder, overridden per entry
  basis: 'sto-3g'
  nelecas: 10
  norbcas: 8
  spin: 0
  charge: 0

# Training geometries: near-equilibrium (~1.1) through strongly stretched.
train_bond_lengths: [1.0, 1.3, 1.6, 2.0, 2.8]

# Held-out geometries for zero-shot evaluation:
#   1.45 — interpolation (between 1.3 and 1.6)
#   3.2  — extrapolation (beyond the training range; near-dissociation)
eval_bond_lengths: [1.45, 3.2]
