# Small-molecule transfer: train on LiF, BeO, BN, C2, evaluate zero-shot on N2 and CO.
#
# All 16 qubits (STO-3G, full valence, 8 orbitals), so this tests transfer across
# CHEMISTRY, not size (the H-chain set does size). 3,136-4,900 determinants, and
# chemical accuracy needs 0.1-12.3% of that (data/subspace/subspace_requirement.csv),
# against ~36% for H-chains. The first bond length per molecule is close to
# equilibrium, the later ones stretched, so correlation strength varies too.
#
# BH, BeH2 and HF are left out on purpose: with qsci.min_dim 50, HF (25 determinants)
# is full CI and BH (100) half its space, so they give little or no training signal.
#
# Select with: experiment=smallmol_<model>
molecules:
  - name: lif_r1.55
    split: train
    molecule:
      _target_: gqe_qsci.molecule.PySCFMolecule
      geometry:
        type: linear_chain
        atoms: ['Li', 'F']
        bond_length: 1.55
      basis: 'sto-3g'
      nelecas: 8
      norbcas: 8
      spin: 0
      charge: 0
