# Diffusion GNN absorbing with the feature-based scorer.
#
# Absorbing DIFFUSION model with a GAT denoiser (not the DAG GNN). Same two
# vocabulary touch points as diffusion_absorbing_matched_features (output head +
# token_embedding of revealed tokens), just with a GAT denoiser instead of a
# TransformerEncoder.
#
# NOTE: the graph here is over gate POSITIONS (a chain), not qubit wires, so
# there is no per-qubit-index embedding to make portable — unlike the DAG GNN.
#
# TODO (2026-10-20): the denoiser is LOCAL. On a chain, one GAT layer = one hop,
# so with num_layers 6 a position only sees positions within +-6. At ngates 15
# (the L=15 runs) gates far apart never influence each other's prediction in a
# forward pass; the TransformerEncoder version connects all positions in every
# layer. Probably change this to make it more global before comparing it again:
# graph_type: full, more layers (>= ngates - 1 covers the chain), or a few
# long-range edges.
#
# Requires torch_geometric:  pip install torch_geometric
#
# Use config  model=diffusion_gnn_absorbing_features  to select this variant.
_target_: gqe_qsci.gqe.models.gnn.CircuitGNNModelAbsorbing
hidden_size: 128
num_layers: 6
num_heads: 4
diffusion_steps: 16
noise_schedule: cosine
dropout: 0.1
graph_type: chain
feature_scorer: true
