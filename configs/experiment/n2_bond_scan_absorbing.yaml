# @package _global_
# N2 bond-length scan (Phase 3) — absorbing diffusion (matched, T=16), feature
# scorer. Same molecule set + trainer settings as the other bond-scan runs;
# W&B group n2-bond-scan.
defaults:
  - override /molecule_set: n2_bond_scan
  - override /model: diffusion_absorbing_matched_features

exp_tag: n2-bond-scan-absorbing-100iter-shots1k-dmax170
ngates: 10
operator_pool:
  dedup_excitations: true
wandb:
  project: ${project.name}
  name: ${exp_tag}
  dir: ${output}
  group: n2-bond-scan
  tags: ["n2", "bond-scan", "multi-molecule", "diffusion", "absorbing", "T16", "featscorer", "phase3"]
trainer:
  max_iters: 100
  num_samples: 10
  batch_size: 10
  warmup_size: 10
  buffer_size: 10
  step_per_epoch: 30
  load_checkpoint: false
  checkpoint_every_n_iters: 25
  precision: 32-true
sampler:
  shots: 1_000
qsci:
  max_dim: 170
