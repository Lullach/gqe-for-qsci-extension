# @package _global_
# ARCHITECTURE COMPARISON at L=15, trained directly on H10.
#
# Two questions in one sweep:
#   1. Does the policy still stall?  At L=10 the best-so-far metrics flattened at
#      step 143 of 540 and the remaining 400 epochs produced nothing. L=15 raises
#      the circuit's reach from 2^10 = 1,024 determinants to 2^15 = 32,768, well
#      past H10's 3,175-slot subspace, so the 2^L ceiling stops binding. If the
#      stall survives that, it is the exploration schedule, not expressivity.
#   2. Which architecture designs better circuits?
#
# CAVEAT, and it is a real one: the five models are NOT capacity-matched. Their
# established configs span roughly 437K parameters (DAG GNN) to ~40M (GPT-2,
# whose n_embd defaults to 768). A ranking that tracks parameter count is a
# capacity result, not an architecture result. n_params is recorded in
# results.csv for exactly this reason -- check it before drawing conclusions,
# and if the ranking correlates with size, a capacity-matched round is needed.
#
# Generated from hchain_baseline_h10.yaml: ONLY the model and ngates differ, so
# everything else that affects difficulty is held fixed. The existing 5-seed
# dag_gnn baseline at L=10 is the reference point for the L effect.
defaults:
  - override /molecule: h10
  - override /model: diffusion_absorbing_matched_features

exp_tag: archL15-diff-absorb-s${trainer.seed}
ngates: 15
operator_pool:
  dedup_excitations: true
wandb:
  project: ${project.name}
  name: ${exp_tag}
  dir: ${output}
  group: arch-comparison-h10-L15
  tags: ["arch-comparison", "L15", "trained-on-h10", "diff-absorb", "featscorer"]
  notes: >-
    Architecture comparison at L=15, trained directly on H10 (20 qubits,
    1.6 A). Architecture: masked/absorbing diffusion, exact DDPO trajectory log-prob. Compare against the
    other archL15-* runs in this group, and against the L=10 dag_gnn
    baseline (hchain-baseline-h10-s*) for the effect of circuit length.
    NOT capacity-matched: see n_params in results.csv before concluding.
trainer:
  max_iters: 540          # matches hchain_dag_gnn's total rollout groups
  num_samples: 10
  batch_size: 10
  warmup_size: 10
  buffer_size: 10
  step_per_epoch: 30
  load_checkpoint: false
  checkpoint_every_n_iters: 100
  precision: 32-true
sampler:
  # 10k, not the paper's 1k. With 1000 shots an N2 circuit sampled only 31
  # DISTINCT determinants (num_sampled_basis), so the raw QSCI subspace was
  # sampling-limited rather than cap-limited — raising qsci.coverage alone
  # would only let classical refinement fill more of it, not improve the
  # circuit's own energy. Shots have to scale with the CI space too.
  shots: 10_000
qsci:
  # Scale the subspace with system size instead of a flat cap. A flat 170
  # covered 100% of H4's CI space and 0.27% of H10's, so the energy error on
  # the held-out molecule was dominated by subspace truncation rather than by
  # circuit quality, and the reward meant something different on every
  # molecule. 5% gives H8 and H10 comparable coverage; H4/H6 fall back to
  # min_dim because 5% of their tiny spaces is a handful of determinants.
  coverage: 0.05
  max_dim: 4000     # ceiling, so H10 cannot demand an intractable diagonalisation
  min_dim: 50
