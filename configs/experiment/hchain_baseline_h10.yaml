# @package _global_
# CONTROL for experiment=hchain_dag_gnn: the same policy trained DIRECTLY on
# H10, the molecule the Phase 5 experiment holds out.
#
# Without this, "zero-shot reached X mHa on H10" says nothing. The question is
# how much of trained-on-H10 performance a policy that never saw H10 recovers.
#
# Matched on everything that affects difficulty: same model, same pool settings,
# same ngates, same shots, same dmax, same rollout size.
#
# max_iters matches the TOTAL TRAINING BUDGET. One epoch is one rollout group,
# so hchain_dag_gnn's 540 epochs are 540 groups (20 on each of 27 molecules);
# this run spends the same 540 entirely on H10. The only difference between the
# two runs is then which molecules the budget went to, which is the comparison
# the experiment exists to make.
#
# The alternative reading — match PER-MOLECULE groups, i.e. 20 — would be a
# strawman: no one training for H10 would stop after 20 groups. Matching the
# total is the harder, more honest test, since the baseline gets every step on
# the target. (With the old 2-molecule set the two readings coincided at 100,
# which is why xmol_baseline_n2 does not have to make the choice explicit.)
defaults:
  - override /molecule: h10
  - override /model: dag_gnn_features

exp_tag: hchain-baseline-h10-s${trainer.seed}
ngates: 10
operator_pool:
  dedup_excitations: true
wandb:
  project: ${project.name}
  name: ${exp_tag}
  dir: ${output}
  group: hchain-h4h6h8-to-h10
  tags: ["h-chains", "phase5", "baseline", "trained-on-h10", "dag", "featscorer"]
  notes: >-
    Matched baseline for the H-chain size-extrapolation experiment: the same
    feature-based DAG GNN trained directly on H10 (20 qubits, 1.6 A) rather
    than transferring from H4/H6/H8. Compare against hchain_dag_gnn's
    zeroshot/h10_r1.60 metrics.
trainer:
  max_iters: 540          # matches hchain_dag_gnn's total rollout groups
  num_samples: 10
  batch_size: 10
  warmup_size: 10
  buffer_size: 10
  step_per_epoch: 30
  load_checkpoint: false
  checkpoint_every_n_iters: 100
  precision: 32-true
sampler:
  shots: 1_000
qsci:
  max_dim: 170
