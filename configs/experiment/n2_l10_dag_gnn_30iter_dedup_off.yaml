# @package _global_
# BASELINE arm of the dedup_excitations A/B: pool as-is (with pair-order
# duplicate excitations -> extra commuting Pauli fragments). Pair with
# n2_l10_dag_gnn_30iter_dedup_on.yaml; identical except operator_pool.
# dedup_excitations. Same W&B group so the two overlay directly.
defaults:
  - override /molecule: n2
  - override /model: dag_gnn

exp_tag: n2-L10-dag-gnn-30iter-dedup-off
ngates: 10
operator_pool:
  dedup_excitations: false      # V = 154 for N2
wandb:
  project: ${project.name}
  name: ${exp_tag}
  dir: ${output}
  group: n2-L10-dedup-ablation
  tags: ["n2", "L10", "30iter", "dag", "GNN", "dedup-off", "ablation"]
trainer:
  max_iters: 30
  num_samples: 10
  batch_size: 10
  warmup_size: 10
  buffer_size: 10
  step_per_epoch: 30
  load_checkpoint: false
  checkpoint_every_n_iters: 10
  precision: 32-true
sampler:
  shots: 1_000
qsci:
  max_dim: 170
