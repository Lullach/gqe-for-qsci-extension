# @package _global_
# ============================ RETIRED ============================
# Superseded by experiment=hchain_dag_gnn / hchain_baseline_h10.
# Kept only so the runs already in W&B group xmol-lih-h2o-to-n2 remain
# reproducible. Do NOT start new work from this experiment.
#
# Two reasons it was retired:
#   1. Two training molecules is too few to call a training set. The
#      replacement trains on 27 (H4/H6/H8 x 9 bond lengths) and holds out a
#      LARGER system (H10), making the eval a size extrapolation.
#   2. It used a flat qsci.max_dim, which covers 100% of LiH's CI space and
#      5.4% of N2's. The reward therefore meant something different on each
#      molecule and the held-out one sat in a truncation regime never seen in
#      training. qsci.coverage now scales the cap with system size; these
#      configs are deliberately left un-migrated.
# =================================================================
# BASELINE for the Phase 4 cross-molecule experiment: the same feature-based
# policy trained directly ON N2, single-molecule.
#
# This is what the zero-shot number from `xmol_dag_gnn` must be compared
# against. Without it "zero-shot reached X mHa" means nothing — the honest
# question is how much of the trained-on-N2 performance transfer recovers.
#
# Matched to xmol_dag_gnn on everything that affects difficulty: same model,
# same pool settings, same shots, same dmax, same rollout size. max_iters=100
# gives N2 the same ~100 rollout groups each training molecule gets there
# (200 epochs round-robined over 2 molecules).
defaults:
  - override /molecule: n2
  - override /model: dag_gnn_features

exp_tag: xmol-baseline-n2-s${trainer.seed}
ngates: 10
operator_pool:
  dedup_excitations: true
wandb:
  project: ${project.name}
  name: ${exp_tag}
  dir: ${output}
  group: xmol-lih-h2o-to-n2
  tags: ["cross-molecule", "phase4", "baseline", "trained-on-n2", "dag", "featscorer"]
trainer:
  max_iters: 100
  num_samples: 10
  batch_size: 10
  warmup_size: 10
  buffer_size: 10
  step_per_epoch: 30
  load_checkpoint: false
  checkpoint_every_n_iters: 50
  precision: 32-true
sampler:
  shots: 1_000
qsci:
  max_dim: 170
