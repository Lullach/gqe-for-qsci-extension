# @package _global_
# ARCHITECTURE COMPARISON WITH ROOM IN THE SUBSPACE: LiF at 1.55 A (4,900 determinants), L=15.
# Model: GPT-2, autoregressive (the original GQE architecture).
#
# The H10 comparison (archL15_*) could not rank the policies: its 5% cap sat far
# below what chemical accuracy needs, so every model hit the same truncation
# floor. Here the cap is 2x the subspace-requirement scan's number (145
# determinants for chemical accuracy -> qsci.max_dim 290), and the requirement
# is small enough for an L=15 circuit to reach. So the remaining error measures
# which determinants the policy selects.
#
# PARAMETER-MATCHED VARIANT (~0.46M parameters instead of 43M): model.size
# matched = n_embd 96, 4 layers, 4 heads (gqe_qsci/gqe/models/gpt2.py, _SIZES),
# the same width/depth/heads as the *_diff_*_small configs, so the transformer
# models sit within 10% of the two GNNs (dag-gnn 437K, diff-gnn 424K).
# Everything else is identical to lifL15_gpt2.
#
# Six models x two molecules (n2L15_*, lifL15_*), seeds 1-5, packed on rt_QC:
#     qsub -W group_list=$ABCIQ_GROUP -v EXPERIMENTS=lifL15_dag_gnn+lifL15_gpt2+...,SEEDS=1-5 hpc/jobs/packed_cpu.sh
defaults:
  - override /molecule: lif
  - override /model: gpt2_features

model:
  size: matched

exp_tag: lifL15-gpt2-small-s${trainer.seed}
ngates: 15
operator_pool:
  dedup_excitations: true
wandb:
  project: ${project.name}
  name: ${exp_tag}
  dir: ${output}
  group: arch-comparison-L15-room
  tags: ["arch-comparison", "L15", "room-in-subspace", "lif", "gpt2", "param-matched"]
trainer:
  max_iters: 100
  num_samples: 10
  batch_size: 10
  warmup_size: 10
  buffer_size: 10
  step_per_epoch: 30
  load_checkpoint: false
  checkpoint_every_n_iters: 50
  precision: 32-true
sampler:
  shots: 10_000
qsci:
  coverage: null
  max_dim: 290
