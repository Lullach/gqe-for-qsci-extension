# @package _global_
# L SWEEP on the H10 baseline, DAG GNN only. One question: how much of the
# subspace can the CIRCUIT reach, and does more length fix the stall?
#
# A circuit of L gates populates at most 2^L determinants, against H10's
# 3,175-slot subspace:
#     L=10 ->  1,024   ceiling BELOW the cap; the rest must be classical
#     L=12 ->  4,096   ceiling just above the cap
#     L=15 -> 32,768   comfortably above
#     L=20 -> 1.05M    far above; tests whether more length still helps
# L=10 already exists as hchain-baseline-h10-s* (5 seeds) and L=15 as
# archL15-dag-gnn-s*, so these two complete a four-point curve at no extra
# comparison cost. Everything except ngates is identical across all four.
defaults:
  - override /molecule: h10
  - override /model: dag_gnn_features

exp_tag: L20-dag-gnn-s${trainer.seed}
ngates: 20
operator_pool:
  dedup_excitations: true
wandb:
  project: ${project.name}
  name: ${exp_tag}
  dir: ${output}
  group: l-sweep-h10
  tags: ["l-sweep", "L20", "trained-on-h10", "dag-gnn", "featscorer"]
  notes: >-
    L sweep on the H10 baseline, DAG GNN, ngates=20. A circuit of L
    gates reaches at most 2^L determinants; H10's subspace cap is 3,175.
    Compare with hchain-baseline-h10-s* (L=10) and archL15-dag-gnn-s*
    (L=15) for the full curve, and to see whether the step-143 stall
    survives more circuit length.
trainer:
  max_iters: 540          # matches hchain_dag_gnn's total rollout groups
  num_samples: 10
  batch_size: 10
  warmup_size: 10
  buffer_size: 10
  step_per_epoch: 30
  load_checkpoint: false
  checkpoint_every_n_iters: 100
  precision: 32-true
sampler:
  # 10k, not the paper's 1k. With 1000 shots an N2 circuit sampled only 31
  # DISTINCT determinants (num_sampled_basis), so the raw QSCI subspace was
  # sampling-limited rather than cap-limited — raising qsci.coverage alone
  # would only let classical refinement fill more of it, not improve the
  # circuit's own energy. Shots have to scale with the CI space too.
  shots: 10_000
qsci:
  # Scale the subspace with system size instead of a flat cap. A flat 170
  # covered 100% of H4's CI space and 0.27% of H10's, so the energy error on
  # the held-out molecule was dominated by subspace truncation rather than by
  # circuit quality, and the reward meant something different on every
  # molecule. 5% gives H8 and H10 comparable coverage; H4/H6 fall back to
  # min_dim because 5% of their tiny spaces is a handful of determinants.
  coverage: 0.05
  max_dim: 4000     # ceiling, so H10 cannot demand an intractable diagonalisation
  min_dim: 50
