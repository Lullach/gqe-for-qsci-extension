project: 
  name: gqe-for-qsci
exp_tag: default-${now:%Y-%m-%d-%H-%M-%S}
output: outputs/${project.name}/${exp_tag}

hydra:
  run:
    dir: ${output}
  output_subdir: hydra

wandb: 
  project: ${project.name}
  name: ${exp_tag}
  dir: ${output}
  group: null
  tags: []

ngates: 10
reference_keys: ["R-CASCI", "R-CCSD"]

sampler:
  mpi: false
  shots: 100_000

operator_pool:
  spec: "pauli_evolution" # or "excitation"
  params: null  # if null, use ccsd amplitudes as parameters
  ccsd_threshold: 1e-6
  remove_z_ladder: true
  only_use_first_pauli: true
  # Drop excitations that are pair-order permutations of one already emitted.
  # The CCSD tensor symmetry t_ijab = t_jiba lists the same physical excitation
  # twice; combined with build_operator_pool's `seen` dedup, each copy silently
  # contributes a DIFFERENT Pauli fragment to the pool. Shrinks V.
  # Default false = current behaviour. See NOTES.md, "Pool redundancy".
  dedup_excitations: false

qsci:
  # Absolute subspace cap. With coverage: null this is used for every molecule;
  # with coverage set it becomes the ceiling, so a large active space cannot
  # demand an intractable diagonalisation.
  max_dim: 2000
  # Target fraction of each molecule's full CI space, C(norb,na)*C(norb,nb).
  # null = flat max_dim everywhere (the original behaviour). Set it — 0.05 is a
  # sensible starting point — for cross-molecule work, where a flat cap makes
  # the reward mean different things on molecules of different size: at
  # max_dim=170, coverage runs from 100% on H4 to 0.27% on H10. See
  # Factory._resolve_max_dim.
  coverage: null
  # Floor, so tiny active spaces still get a usable subspace.
  min_dim: 50
  enlarge_method: "symmetry_completion"
  max_cycle: 1000
  eigsh_kwargs: {"tol": 1e-14, "maxiter": 5000}

defaults:
  - model: gpt2
  - molecule: n2
  - trainer: default
  # Multi-molecule training (Phase 2+). Null = single-molecule (uses `molecule`
  # above). Set e.g. molecule_set=n2_bond_scan to train across a molecule set.
  # Must precede `experiment` so an experiment can `override /molecule_set`.
  - optional molecule_set: null
  - _self_
  - optional experiment: null

vocab_size: 0 # Dummy, will be overwritten in factory.py
